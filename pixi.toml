[workspace]
name = "tango-ucx-benchmarks"
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.55"

[dependencies]
cmake = "*"
ninja = "*"
clang-format = "*"
cxx-compiler = "*"
# What the installed tango-ucx package needs to be found and linked.
cpptango = ">=10.0"
cppzmq = "*"
ucx = ">=1.21"
nlohmann_json = ">=3.12"
# The driver.
python = ">=3.11"
hdf5 = ">=2.2.0,<3"
h5py = ">=3.16.0,<4"

[feature.gpu.dependencies]
# ucx_perftest's CUDA allocator is a plugin linked to the CUDA runtime. UCX's
# driver-based transports alone can be present while `-m cuda` still fails.
cuda-version = "12.9.*"
cuda-cudart = "*"
cuda-cudart-dev = "*"
cuda-nvcc = "*"

[feature.zarr.dependencies]
# acquire-zarr is not packaged: stage_zarr.sh builds it from source against these. Its S3 client,
# minio-cpp, is linked in whether or not S3 is used, hence curl, OpenSSL and pugixml.
blosc = ">=1.21.5"
libcrc32c = ">=1.1.2"
zstd = ">=1.5.5"
yaml-cpp = ">=0.8.0"
openssl = "*"
pugixml = "*"
curlpp = "*"
libcurl = "*"
zlib = "*"
# The driver reads the stitched capture back with the reference reader, and with tensorstore.
zarr = ">=3.1"
tensorstore = "*"

[feature.zarr.tasks]
stage-zarr = "bash stage_zarr.sh"
configure-zarr = { cmd = "cmake -GNinja -S . -B build-zarr \"-DCMAKE_PREFIX_PATH=$PWD/stage;$PWD/stage-zarr;$CONDA_PREFIX\" -DBENCHMARKS_ZARR=ON", depends-on = ["stage", "stage-zarr"] }
build-zarr = { cmd = "cmake --build build-zarr", depends-on = ["configure-zarr"] }
test-zarr = { cmd = "ctest --test-dir build-zarr -R 'write' --output-on-failure", depends-on = ["build-zarr"] }

[environments]
default = ["default"]
gpu = ["default", "gpu"]
zarr = ["default", "zarr"]

[feature.gpu.tasks]
cuda-ipc = "python cuda_ipc.py"
stage-gpu = "bash stage_gpu.sh"
configure-gpu = { cmd = "cmake -GNinja -S . -B build-gpu -DCMAKE_PREFIX_PATH=$PWD/stage-gpu -DBENCHMARKS_CUDA=ON", depends-on = ["stage-gpu"] }
build-gpu = { cmd = "cmake --build build-gpu", depends-on = ["configure-gpu"] }
test-gpu = { cmd = "ctest --test-dir build-gpu --output-on-failure", depends-on = ["build-gpu"] }
cuda-compare = { cmd = "python compare_ucx.py --memory cuda --build build-gpu", depends-on = ["build-gpu"] }

[tasks]
# The library is built in its own environment, with `pixi run build-profile` there: optimized,
# with frame pointers. stage.sh brings that build up to date and installs it here.
stage = "bash stage.sh"
configure = { cmd = "cmake -GNinja -S . -B build -DCMAKE_PREFIX_PATH=$PWD/stage", depends-on = ["stage"] }
build = { cmd = "cmake --build build", depends-on = ["configure"] }
test = { cmd = "ctest --test-dir build --output-on-failure", depends-on = ["build"] }
